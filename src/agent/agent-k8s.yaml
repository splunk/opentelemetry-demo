# Kubernetes manifest for agent (OTel demo GenAI stack)
# ChatLLM + VCR live in src/genai; this Deployment is the LangGraph /prompt API.
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    opentelemetry.io/name: agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: agent
    app.kubernetes.io/version: 2.1.3
    app.kubernetes.io/part-of: splunk-opentelemetry-demo
spec:
  type: ClusterIP
  ports:
  - port: 8010
    name: tcp-service
    targetPort: 8010
  selector:
    opentelemetry.io/name: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    opentelemetry.io/name: agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: agent
    app.kubernetes.io/version: 2.1.3
    app.kubernetes.io/part-of: splunk-opentelemetry-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      opentelemetry.io/name: agent
  template:
    metadata:
      labels:
        opentelemetry.io/name: agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/name: agent
    spec:
      serviceAccountName: splunk-opentelemetry-demo
      containers:
      - name: agent
        image: ghcr.io/splunk/opentelemetry-demo/otel-agent:2.0.9
        imagePullPolicy: Always
        ports:
        - containerPort: 8010
          name: service
        env:
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['app.kubernetes.io/component']
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_COLLECTOR_NAME
          value: $(NODE_IP)
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: AGENT_PORT
          value: '8010'
        - name: GRAPH_RECURSION_LIMIT
          value: '25'
        - name: MCP_ENABLED
          value: 'True'
        - name: MCP_ENDPOINT
          value: mcp
        - name: MCP_PORT
          value: '8011'
        - name: APPLICATION_ENDPOINT
          value: frontend:8080
        - name: LLM_BASE_URL
          value: https://local-llm.com
        - name: LLM_MODEL
          value: claude-opus-4-7
        - name: API_KEY
          value: sk-dummy
        - name: OPENAI_API_KEY
          value: sk-dummy
        - name: USE_VCR
          value: 'true'
        - name: VCR_MATCH_THRESHOLD
          value: '0.85'
        - name: LLM_TLS_VERIFY
          value: 'true'
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: 'true'
        - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
          value: 'true'
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: gen_ai_latest_experimental
        - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
          value: span_only
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://$(OTEL_COLLECTOR_NAME):4317
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: TRACELOOP_BASE_URL
          value: http://$(OTEL_COLLECTOR_NAME):4318
        - name: TRACELOOP_TRACE_CONTENT
          value: 'true'
        - name: SPLUNK_AO_ENABLED
          value: 'true'
        - name: SPLUNK_AO_REALM
          valueFrom:
            secretKeyRef:
              name: workshop-secret
              key: realm
              optional: true
        - name: SPLUNK_AO_O11Y_TOKEN
          valueFrom:
            secretKeyRef:
              name: workshop-secret
              key: access_token
              optional: true
        - name: SPLUNK_AO_PROJECT
          value: opentelemetry-demo
        - name: SPLUNK_AO_AGENT_STREAM
          value: opentelemetry-demo
        - name: WORKSHOP_ENVIRONMENT
          valueFrom:
            secretKeyRef:
              name: workshop-secret
              key: instance
              optional: true
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=2.1.3,service.kafka=no,deployment.environment=$(WORKSHOP_ENVIRONMENT),deployment.environment.name=$(WORKSHOP_ENVIRONMENT)
        resources:
          limits:
            memory: 500Mi
        volumeMounts: null
      volumes: null
