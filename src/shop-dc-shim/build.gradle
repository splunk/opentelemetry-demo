plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.opentelemetry.demo'
version = '2.1.3'

// Last OSS Spring Boot 3.5.x (VULN-90122/90123). Pulls Spring Framework
// 6.2.19 (VULN-112038/112036/112034/112020, CVE-2026-41848 cluster),
// Spring Data Commons 3.5.13 (VULN-112037), logback 1.5.34 (VULN-85744),
// assertj 3.27.7 (VULN-84827), reactor-netty 1.2.x (VULN-85511).

// CVE-2024-31573: default xmlunit-core config enables XSLT extension
// functions. Fixed in 2.10.0 (VULN-86335 was 2.9.1).
ext['xmlunit.version'] = '2.10.0'

// Boot 3.5.16 BOM still manages Netty 4.1.135.Final. FOSSA flags that
// train (VULN-107390/107380/107375). 4.1.139.Final is the current 4.1
// security release.
ext['netty.version'] = '4.1.139.Final'

// CVE-2024-57699: json-smart 2.5.0-2.5.1 stack exhaustion via crafted
// input containing many '{' characters (incomplete fix for CVE-2023-1370).
// Fixed in 2.5.2.
ext['json-smart.version'] = '2.5.2'

// Explicit even though Boot 3.5.16 already manages 6.2.19, so FOSSA
// originPath src/shop-dc-shim/build.gradle sees the pin (VULN-112038).
ext['spring-framework.version'] = '6.2.19'

// CVE-2026-54512 jackson-databind PTV bypass. Boot 3.5.16 BOM is 2.21.4
// (fixed floor); force 2.21.5 to match ad/fraud-detection.
ext['jackson-bom.version'] = '2.21.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// CVE-2026-45292: opentelemetry-java <1.62.0 baggage propagation DoS.
// Direct deps are pinned to 1.62.0 but Spring Boot's dependency
// management and other transitives can still declare older
// opentelemetry-api versions. Force every io.opentelemetry artifact
// to 1.62.0.
//
// VULN-107350 (bcprov-jdk15on 1.65) / VULN-84959 (1.80.2): relocate
// leftover Bouncy Castle 1.65/1.80 trains onto jdk18on 1.86.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.opentelemetry') {
            details.useVersion '1.62.0'
        }
        if (details.requested.group == 'org.bouncycastle') {
            def name = details.requested.name
            if (name.contains('jdk15on') || name.contains('jdk15to18')) {
                details.useTarget "org.bouncycastle:${name.replace('jdk15on', 'jdk18on').replace('jdk15to18', 'jdk18on')}:1.86"
            } else {
                details.useVersion '1.86'
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot dependencies
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    
    // SQL Server driver. mssql-jdbc optionally declares bcprov-jdk18on
    // (Always Encrypted). FOSSA still counts that optional (VULN-84959
    // 1.80.2 / CVE-2026-8763). Exclude the stale optional and pin 1.86.
    runtimeOnly('com.microsoft.sqlserver:mssql-jdbc') {
        exclude group: 'org.bouncycastle'
    }
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    
    // OpenTelemetry (for Splunk Observability)
    // CVE-2026-45292: opentelemetry-java <1.62.0 baggage propagation is
    // vulnerable to unbounded CPU/memory when parsing oversized baggage.
    implementation 'io.opentelemetry:opentelemetry-api:1.62.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.62.0'
    
    // gRPC dependencies
    // CVE-2026-44249: netty-handler <4.1.135.Final has an IPv6 subnet
    // bypass. grpc-netty-shaded bundles Netty into io.grpc.netty.shaded.*
    // so the io.netty resolutionStrategy cannot override it. Bump the
    // grpc-java stack to 1.82.1 (latest) to pick up newer bundled Netty.
    implementation 'io.grpc:grpc-netty-shaded:1.82.1'
    implementation 'io.grpc:grpc-protobuf:1.82.1'
    implementation 'io.grpc:grpc-stub:1.82.1'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    
    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Annotations
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.82.1'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
}

